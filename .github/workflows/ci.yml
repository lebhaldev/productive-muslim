name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional upload key (see RELEASE.md). Without these secrets, release
      # builds are signed with a throwaway debug key and cannot go to Play.
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check generated database code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/
      - run: flutter analyze
      - run: flutter test
      - name: Use the upload key when its secrets are set
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$UPLOAD_KEYSTORE_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          keyPassword=$UPLOAD_KEY_PASSWORD
          EOF
      - name: Build debug APK
        run: flutter build apk --debug
      # Small per-phone APKs: release mode (AOT, R8 shrinking, icon tree-shaking),
      # one APK per CPU type instead of all of them in one file.
      - name: Build release APKs split per CPU type
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          ls -la build/app/outputs/flutter-apk/
      # The bundle Play needs. Only useful when signed with the upload key;
      # a human uploads it in Play Console (RELEASE.md).
      - name: Build Play bundle
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols-aab
      - uses: actions/upload-artifact@v4
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        with:
          name: nurday-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: nurday-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nurday-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
      - name: Rename APKs
        if: github.event_name == 'push'
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk nurday-debug.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk nurday.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk nurday-armv7.apk
      # A public pre-release so testers (and the Notion sync) can download the
      # latest debug APK without signing in to GitHub.
      - name: Publish latest debug APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Nurday debug build (latest)
          prerelease: true
          make_latest: false
          body: |
            Debug APK from branch ${{ github.ref_name }}, commit ${{ github.sha }}.
            Not signed for release. Install on an Android phone with "Install unknown apps" allowed.
          files: nurday-debug.apk
      # The small APK most phones need (arm64), plus one for older 32-bit phones.
      - name: Publish latest small APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Nurday APK (latest)
          prerelease: true
          make_latest: false
          body: |
            Release-mode APK from branch ${{ github.ref_name }}, commit ${{ github.sha }}.
            nurday.apk fits almost every phone from the last ~8 years (arm64).
            nurday-armv7.apk is for older 32-bit phones.
            Signed with a test key, not the Play Store key. Install with "Install unknown apps" allowed.
          files: |
            nurday.apk
            nurday-armv7.apk
